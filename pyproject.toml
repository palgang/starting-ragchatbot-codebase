[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.0.15",
    "anthropic==0.58.2",
    "sentence-transformers==5.0.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "ruff>=0.17.3",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
# Conservative starting set: real errors (pyflakes) and syntax/runtime-breaking
# pycodestyle rules. Formatting is handled by black, so style rules are omitted.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# warnings.filterwarnings() must run before the imports in app.py
"backend/app.py" = ["E402"]
